# The only repo-specific texts of the website. Everything else comes from the
# repository: the English intro from README.md, the commands from the built CLI.

# How the API is accessed: open | key (env: VAR) | account (token, user, password: VARs)
access:
  type: account
  token: DESTATIS_API_TOKEN
  user: DESTATIS_USERNAME
  password: DESTATIS_PASSWORD

de:
  # German version of the README's intro paragraph. Keep it in step with README.md.
  intro: >-
    Ein TypeScript-**API-Client mit CLI** für die **REST-API von DESTATIS GENESIS-Online**
    (Version 2020) – die Datenbank der amtlichen Statistik des Statistischen Bundesamtes unter
    [www-genesis.destatis.de](https://www-genesis.destatis.de).
